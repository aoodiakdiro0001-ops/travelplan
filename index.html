curPlan={o,b,it,time:new Date().toLocaleString()};
const per=b.per;
document.getElementById('planRes').innerHTML=`<b class="big">${fmt(b.tot,o.cur)}</b> <small>(${fmt(b.day*o.trav,o.cur)} ${t('cDay')})</small><table class="bt"><tr><td>${t('cHotel')}</td><td class="n">${fmt(per.hotel*o.days*o.trav,o.cur)}</td></tr><tr><td>${t('cFood')}</td><td class="n">${fmt(per.food*o.days*o.trav,o.cur)}</td></tr><tr><td>${t('cTrans')}</td><td class="n">${fmt(per.trans*o.days*o.trav,o.cur)}</td></tr><tr><td>${t('cAct')}</td><td class="n">${fmt(per.act*o.days*o.trav,o.cur)}</td></tr><tr><td>${t('cFlight')}</td><td class="n">${fmt(b.flights,o.cur)}</td></tr><tr><td><b>${t('cTot')}</b></td><td class="n"><b>${fmt(b.tot,o.cur)}</b></td></tr></table>`;
document.getElementById('itinOut').innerHTML=it.map(x=>`<div class="day"><b class="dh">${t('dayL')} ${x.d}</b><span class="cost">${fmt(b.day*o.trav,o.cur)}</span><br><small style="color:var(--mut)">${x.label}</small><ul>${x.spots.map(s=>`<li>${s}</li>`).join('')}</ul><small style="color:var(--mut)">${x.spots.length} ${t('spotsL')}</small></div>`).join('');
renderAff();
return b;
}
function hist(){try{return JSON.parse(localStorage.getItem('tp_hist')||'[]');}catch(e){return [];}
}
function savePlan(){if(!curPlan)plan();if(!curPlan)return;try{const h=hist();h.unshift({d:curPlan.o.dest,days:curPlan.o.days,trav:curPlan.o.trav,tot:Math.round(curPlan.b.tot),time:curPlan.time});localStorage.setItem('tp_hist',JSON.stringify(h.slice(0,50)));}catch(e){}renderHist();toast(t('saved'));}
function renderHist(){const h=hist();document.getElementById('histList').innerHTML=h.map((x,i)=>{const d=DESTS[x.d]||DESTS[0];return `<div class="hist"><b style="flex:1">${dName(d)} · ${x.days}d · ${x.trav}pax</b><b>$${Math.round(x.tot).toLocaleString('en-US')}</b><small style="color:var(--mut)">${x.time||''}</small><button class="alt" style="padding:5px 12px;font-size:12px" onclick="delHist(${i})">❌</button></div>`;}).join('')||'<p style="color:var(--mut)">—</p>';}
function delHist(i){try{const h=hist();h.splice(i,1);localStorage.setItem('tp_hist',JSON.stringify(h));}catch(e){}renderHist();}
function printPlan(){if(!curPlan)plan();if(!curPlan)return;const b=curPlan.b,o=curPlan.o;
document.getElementById('printArea').innerHTML=`<h2>TripPlan — ${dName(b.d)} ${o.days}d</h2><table>${['cHotel','cFood','cTrans','cAct'].map((k,i)=>`<tr><td>${t(k)}</td><td>${[b.per.hotel,b.per.food,b.per.trans,b.per.act][i]*o.days*o.trav} USD</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${Math.round(b.tot)} USD</b></td></tr></table>`;window.print();}
function affFor(k,q){const a=AFFS.find(x=>x.k===k);const base=(CONFIG.aff&&CONFIG.aff[k])||(a?a.u(q):'#');return base;}
function isAff(k){return !!(CONFIG.aff&&CONFIG.aff[k]);}
function renderAff(){
const d=DESTS[+document.getElementById('cDest').value||0]||DESTS[0];
const q=dName(d);
document.getElementById('affGrid').innerHTML=AFFS.map(a=>`<div class="aff"><b>${a.n}${isAff(a.k)?'<span class="refbadge">REF</span>':''}</b><small>${a.d} — ${q}</small><br><a target="_blank" rel="nofollow sponsored noopener" href="${affFor(a.k,q)}">→</a></div>`).join('');
}
function renderDonate(){
document.getElementById('btcA').textContent=CONFIG.pay.btc;
document.getElementById('usdtA').textContent=CONFIG.pay.usdt;
}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
setLang('en');loadAds();renderDonate();
</script>
</body>
</html>
